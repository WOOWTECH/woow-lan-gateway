name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Run contract tests
        env:
          PYTHONPATH: src
        run: python3 -m unittest discover -s tests -v

  # The App Store ships only published Releases (registry ref_policy: release).
  # After the checks above pass on main, the Store's shared workflow publishes
  # the Release for a config.yaml version that has none yet.
  release:
    name: Release
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    uses: WOOWTECH/Woow_HA_App_Store/.github/workflows/woow-addon-release.yml@main
